# development and CI only: users run the shipped scripts on their own python3
[tools]
python = "latest"
node = "lts"
yq = "latest"


[tasks.validate]
description = "Validate the marketplace and every plugin, and parse every SKILL.md frontmatter as strict YAML"
run = "scripts/validate.sh"

[tasks.ci]
description = "Everything CI runs: validate, then each plugin's own ci task"
depends = ["validate"]
run = "scripts/ci.sh"
