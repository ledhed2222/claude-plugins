# development and CI only: users run the shipped scripts on their own python3
[tools]
python = "latest"
node = "lts"

[tasks.validate]
description = "Validate the marketplace and every plugin"
run = ['claude plugin validate .', 'for p in plugins/*/; do claude plugin validate "$p"; done']

[tasks.ci]
description = "Everything CI runs: validate, then each plugin's own ci task"
depends = ["validate"]
run = 'for f in plugins/*/mise.toml; do mise -C "$(dirname "$f")" run ci || exit 1; done'
