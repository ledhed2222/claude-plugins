name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - run: npm install -g @anthropic-ai/claude-code
      - run: mise run ci
